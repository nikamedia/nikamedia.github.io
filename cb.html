<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Nika Media - Kết nối kênh</title>
</head>
<body style="font-family:sans-serif;max-width:640px;margin:60px auto;padding:0 16px">
<h2 id="t">Đang hoàn tất kết nối...</h2>
<div id="b"></div>
<script>
(function () {
  var q = location.search.replace(/^\?/, "");
  var p = new URLSearchParams(q);
  var st = p.get("state") || "";
  var parts = st.split("~");
  var t = document.getElementById("t"), b = document.getElementById("b");
  if (p.get("error")) { t.textContent = "Đã hủy cấp quyền."; return; }
  if (!p.get("code")) { t.textContent = "Trang này dùng để kết nối kênh YouTube của Nika Media."; return; }
  var host = parts[1] === "L" ? parts[2] || "" : "";
  if (/^(192\.168|10|172\.(1[6-9]|2\d|3[01]))(\.\d{1,3}){2,3}:\d{2,5}$/.test(host)) {
    var go = "http://" + host + "/?" + q;
    b.innerHTML = '<p>Nếu không tự chuyển, bấm: <a id="a">Hoàn tất</a></p>';
    document.getElementById("a").href = go;
    location.replace(go);
    return;
  }
  t.textContent = "Đã cấp quyền. Copy mã dưới gửi lại cho trợ lý Nika:";
  var ta = document.createElement("textarea");
  ta.value = q; ta.readOnly = true; ta.style.cssText = "width:100%;height:120px";
  var btn = document.createElement("button");
  btn.textContent = "Copy mã"; btn.style.cssText = "padding:10px 18px;font-size:16px;margin-top:8px";
  btn.onclick = function () { ta.select(); try { navigator.clipboard.writeText(q); } catch (e) { document.execCommand("copy"); } btn.textContent = "Đã copy"; };
  b.appendChild(ta); b.appendChild(btn);
})();
</script>
</body>
</html>
